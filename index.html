<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBWAY 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:10;background:linear-gradient(#000c,transparent);pointer-events:none}
#hud b{background:#ffe600;color:#000;padding:7px 14px;border-radius:20px;font-size:14px}
#speedBar{position:fixed;top:52px;left:12px;right:12px;height:6px;background:#fff3;border-radius:10px;overflow:hidden;z-index:10}
#speedFill{height:100%;width:10%;background:linear-gradient(90deg,#00e676,#ffe600,#ff1744)}
#menu{position:fixed;inset:0;background:linear-gradient(#000d,#000a),url('https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=800') center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:100;padding:20px}
#menu h1{font-size:52px;color:#ffe600;line-height:.85;text-shadow:0 5px 0 #000;letter-spacing:-2px}
#menu h1 span{color:#00e676}
#play{background:#00e676;color:#000;font-size:26px;padding:18px 44px;border:4px solid #fff;border-radius:16px;font-weight:900;box-shadow:0 8px 0 #009624;cursor:pointer}
#controls{position:fixed;bottom:16px;left:0;right:0;display:none;justify-content:center;gap:14px;z-index:50}
#controls button{width:76px;height:76px;border-radius:50%;border:3px solid #fff;font-size:28px;background:#fffc}
#jump{background:#ffe600!important}
#roll{background:#2979ff!important;color:#fff!important}
#msg{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);background:#000e;padding:22px;border:3px solid #ff1744;border-radius:16px;display:none;z-index:90;text-align:center;font-size:22px;width:85%;max-width:340px}
#touchHint{position:fixed;bottom:110px;left:0;right:0;text-align:center;z-index:40;text-shadow:0 2px 5px #000;font-size:14px;pointer-events:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="hud"><b>🏃 SUBWAY 3D</b><b id="score">0 | 🪙 0</b></div>
<div id="speedBar"><div id="speedFill"></div></div>
<div id="touchHint">👉 ARRASTA O DEDO PRO LADO 👈</div>
<div id="menu">
<h1>SUBWAY<br><span>3D</span></h1>
<p style="background:#000a;padding:8px 14px;border-radius:20px">Fuja do guarda! Desvie dos trens!</p>
<p style="font-size:13px;line-height:1.6">👆 ARRASTA O DEDO pra trocar de pista<br>⬆️ Arrasta pra cima = pular<br>⬇️ Arrasta pra baixo = rolar<br>⚡ Quanto mais corre, mais rápido!</p>
<button id="play" onclick="startGame()">▶️ CORRER!</button>
</div>
<div id="msg"></div>
<div id="controls">
<button id="btnL">⬅️</button>
<button id="jump">⬆️</button>
<button id="roll">⬇️</button>
<button id="btnR">➡️</button>
</div>
<script>
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,25,95);
let camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,300);
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';renderer.domElement.style.inset='0';renderer.domElement.style.zIndex='1';
scene.add(new THREE.AmbientLight(0xffffff,0.65));
let sun=new THREE.DirectionalLight(0xfff2cc,1.15);
sun.position.set(8,18,6);sun.castShadow=true;sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87CEEB,0x5d4037,0.6));
let clouds=[];
for(let i=0;i<8;i++){
  let g=new THREE.Group();
  for(let j=0;j<3;j++){let c=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*1.5,12,12),new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.9}));c.position.set(j*2.5,Math.random(),0);g.add(c)}
  g.position.set(-30+Math.random()*60,14+Math.random()*6,-40-Math.random()*60);scene.add(g);clouds.push(g);
}
let ground=new THREE.Mesh(new THREE.BoxGeometry(14,1,220),new THREE.MeshLambertMaterial({color:0x4a4a4a}));ground.position.set(0,-0.5,0);ground.receiveShadow=true;scene.add(ground);
for(let i=-1;i<=1;i++){
  let ballast=new THREE.Mesh(new THREE.BoxGeometry(3,0.18,220),new THREE.MeshLambertMaterial({color:0x6d4c41}));ballast.position.set(i*3.4,-0.05,0);scene.add(ballast);
  for(let s of [-0.8,0.8]){
    let rail=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.22,220),new THREE.MeshLambertMaterial({color:0xbdbdbd}));rail.position.set(i*3.4+s,0.12,0);scene.add(rail);
  }
  for(let z=-100;z<100;z+=1.5){
    let sl=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.08,0.5),new THREE.MeshLambertMaterial({color:0x3e2723}));sl.position.set(i*3.4,0.02,z);scene.add(sl);
  }
}
let props=[];
for(let z=0;z>-180;z-=8){
  let pole=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,6,8),new THREE.MeshLambertMaterial({color:0x37474f}));pole.position.set(-6.8,3,z);pole.castShadow=true;scene.add(pole);props.push(pole);
  let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,2,8),new THREE.MeshLambertMaterial({color:0x5d4037}));trunk.position.set(7.5,1,z+4);scene.add(trunk);props.push(trunk);
  let leaves=new THREE.Mesh(new THREE.SphereGeometry(1.6,10,10),new THREE.MeshLambertMaterial({color:0x2e7d32}));leaves.position.set(7.5,3.2,z+4);leaves.castShadow=true;scene.add(leaves);props.push(leaves);
}
let buildings=[];
function makeBuilding(x,z){
  let h=6+Math.random()*12;
  let g=new THREE.Group();
  let b=new THREE.Mesh(new THREE.BoxGeometry(5,h,5),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.3,0.45)}));b.position.y=h/2;b.castShadow=true;g.add(b);
  for(let wy=1;wy<h-1;wy+=1.8) for(let wx=-1.6;wx<=1.6;wx+=1.1){
    let w=new THREE.Mesh(new THREE.PlaneGeometry(0.7,1),new THREE.MeshBasicMaterial({color:Math.random()>0.5?0xfff59d:0x90caf9}));w.position.set(wx,wy,2.55);g.add(w);
  }
  g.position.set(x,0,z);scene.add(g);return g;
}
for(let i=0;i<22;i++){buildings.push(makeBuilding(-11,-i*9));buildings.push(makeBuilding(11,-i*9-4))}
let player=new THREE.Group();
let torso=new THREE.Mesh(new THREE.BoxGeometry(0.85,1.05,0.5),new THREE.MeshLambertMaterial({color:0xffffff}));torso.position.y=1.25;torso.castShadow=true;player.add(torso);
let backpack=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.7,0.3),new THREE.MeshLambertMaterial({color:0xff6d00}));backpack.position.set(0,1.3,-0.4);player.add(backpack);
let head=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.62),new THREE.MeshLambertMaterial({color:0xffcc80}));head.position.y=2.05;head.castShadow=true;player.add(head);
let hair=new THREE.Mesh(new THREE.BoxGeometry(0.64,0.28,0.64),new THREE.MeshLambertMaterial({color:0x212121}));hair.position.y=2.32;player.add(hair);
let capTop=new THREE.Mesh(new THREE.BoxGeometry(0.68,0.12,0.72),new THREE.MeshLambertMaterial({color:0xd50000}));capTop.position.y=2.42;player.add(capTop);
let armL=new THREE.Group();let armLMesh=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.9,0.22),new THREE.MeshLambertMaterial({color:0xffffff}));armLMesh.position.y=-0.4;armL.add(armLMesh);armL.position.set(-0.55,1.7,0);player.add(armL);
let armR=armL.clone();armR.position.x=0.55;player.add(armR);
let legL=new THREE.Group();let legLMesh=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.85,0.32),new THREE.MeshLambertMaterial({color:0x1565c0}));legLMesh.position.y=-0.42;legL.add(legLMesh);let shoeL=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.18,0.6),new THREE.MeshLambertMaterial({color:0xff1744}));shoeL.position.set(0,-0.85,0.12);legL.add(shoeL);legL.position.set(-0.22,0.85,0);player.add(legL);
let legR=legL.clone();legR.position.x=0.22;player.add(legR);
scene.add(player);
let shadowBlob=new THREE.Mesh(new THREE.CircleGeometry(0.7,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3}));shadowBlob.rotation.x=-Math.PI/2;shadowBlob.position.y=0.02;scene.add(shadowBlob);
let playing=false,lane=1,playerX=0,targetX=0,playerY=0,vy=0,jumping=false,rolling=false,rollT=0,score=0,coins=0,speed=0.30,obstacles=[],coinMesh=[],gameOver=false,runTime=0;
let lanesX=[-3.4,0,3.4];
function startGame(){
  playing=true;lane=1;playerX=0;targetX=0;playerY=0;vy=0;score=0;coins=0;speed=0.30;runTime=0;gameOver=false;
  obstacles.forEach(o=>scene.remove(o.mesh));obstacles=[];
  coinMesh.forEach(c=>scene.remove(c));coinMesh=[];
  document.getElementById('menu').style.display='none';
  document.getElementById('controls').style.display='flex';
  document.getElementById('msg').style.display='none';
  setTimeout(()=>{document.getElementById('touchHint').style.display='none'},4000);
}
function left(){if(playing){lane=Math.max(0,lane-1);targetX=lanesX[lane]}}
function right(){if(playing){lane=Math.min(2,lane+1);targetX=lanesX[lane]}}
function jump(){if(playing&&!jumping){jumping=true;vy=0.20;rolling=false}}
function roll(){if(playing){rolling=true;rollT=45;jumping=false;playerY=0;vy=0}}
function bind(id,fn){let b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});b.addEventListener('click',fn)}
bind('btnL',left);bind('btnR',right);bind('jump',jump);bind('roll',roll);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')left();if(e.key=='ArrowRight')right();if(e.key=='ArrowUp')jump();if(e.key=='ArrowDown')roll()});
let sx=0,sy=0,dragging=false,lastX=0;
addEventListener('touchstart',e=>{if(!playing) return; sx=e.touches[0].clientX;sy=e.touches[0].clientY;lastX=sx;dragging=true},{passive:true});
addEventListener('touchmove',e=>{
  if(!dragging||!playing) return;
  let x=e.touches[0].clientX, y=e.touches[0].clientY;
  let dx=x-lastX;
  if(Math.abs(dx)>2){playerX+=dx*0.018;playerX=Math.max(-3.4,Math.min(3.4,playerX));lastX=x;}
  let dy=y-sy;
  if(dy<-45){jump();sy=y;dragging=false}
  if(dy>45){roll();sy=y;dragging=false}
},{passive:true});
addEventListener('touchend',e=>{
  if(!playing) return;
  dragging=false;
  let nearest=0,bestD=999;
  lanesX.forEach((lx,i)=>{let d=Math.abs(playerX-lx);if(d<bestD){bestD=d;nearest=i}});
  lane=nearest;targetX=lanesX[lane];
},{passive:true});
function spawn(){
  let chance=0.014 + speed*0.012;
  if(Math.random()<chance){
    let l=Math.floor(Math.random()*3);
    let r=Math.random();
    let mesh,type;
    if(r<0.45){
      mesh=new THREE.Group();
      let bodyM=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,14),new THREE.MeshLambertMaterial({color:0xe53935}));bodyM.position.y=1.3;bodyM.castShadow=true;mesh.add(bodyM);
      let roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.25,13.5),new THREE.MeshLambertMaterial({color:0xb71c1c}));roof.position.y=2.6;mesh.add(roof);
      let win=new THREE.Mesh(new THREE.BoxGeometry(2.45,0.7,11),new THREE.MeshLambertMaterial({color:0x90caf9}));win.position.y=1.8;mesh.add(win);
      type='train';
    } else if(r<0.75){
      mesh=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.15,1.1),new THREE.MeshLambertMaterial({color:0xff9800}));mesh.position.y=0.58;mesh.castShadow=true;
      type='barrier';
    } else {
      mesh=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.2,0.7),new THREE.MeshLambertMaterial({color:0x2979ff}));mesh.position.y=1.1;mesh.castShadow=true;
      type='high';
    }
    mesh.position.set(lanesX[l],0,-85);
    scene.add(mesh);
    obstacles.push({mesh,lane:l,z:-85,type});
  }
  if(Math.random()<0.045){
    let l=Math.floor(Math.random()*3);
    let c=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.14,20),new THREE.MeshLambertMaterial({color:0xffd600}));c.rotation.x=Math.PI/2;
    c.position.set(lanesX[l],1.1,-85);scene.add(c);coinMesh.push(c);
  }
}
function doGameOver(){
  playing=false;gameOver=true;
  document.getElementById('controls').style.display='none';
  let m=document.getElementById('msg');m.style.display='block';
  m.innerHTML='💥 BATEU!<br>Score '+Math.floor(score)+' | 🪙 '+coins+'<br>⏱️ Sobreviveu '+Math.floor(runTime)+'s | Velocidade '+Math.round(speed*100)+' km/h<br><br><button onclick="location.reload()" style="background:#00e676;border:0;padding:12px 28px;border-radius:12px;font-weight:bold;font-size:18px">🔄 JOGAR DE NOVO</button>';
}
let clock=0;
function animate(){
  requestAnimationFrame(animate);
  clock+=0.016;
  if(playing){
    runTime+=0.016;
    speed=0.30 + (runTime/10)*0.12;
    speed=Math.min(1.05,speed);
    score+=speed*3;
    spawn();
    if(jumping){playerY+=vy;vy-=0.009;if(playerY<=0){playerY=0;jumping=false}}
    if(rolling){rollT--;if(rollT<=0)rolling=false}
    obstacles.forEach(o=>{o.z+=speed*10;o.mesh.position.z=o.z});
    coinMesh.forEach(c=>{c.position.z+=speed*10;c.rotation.y+=0.15});
    obstacles=obstacles.filter(o=>{if(o.z>12){scene.remove(o.mesh);return false}return true});
    coinMesh=coinMesh.filter(c=>{if(c.position.z>12){scene.remove(c);return false}return true});
    buildings.forEach(b=>{b.position.z+=speed*10;if(b.position.z>12)b.position.z-=198});
    props.forEach(p=>{p.position.z+=speed*10;if(p.position.z>12)p.position.z-=180});
    clouds.forEach(c=>{c.position.z+=speed*2;if(c.position.z>20)c.position.z=-120});
    let px=playerX;
    obstacles.forEach(o=>{
      if(Math.abs(o.mesh.position.x-px)<1.4 && Math.abs(o.z)<2.2){
        let hit=false;
        if(o.type=='train') hit=true;
        if(o.type=='barrier' && !(jumping && playerY>0.7)) hit=true;
        if(o.type=='high' && !rolling) hit=true;
        if(hit && !gameOver) doGameOver();
      }
    });
    coinMesh.forEach(c=>{
      if(Math.abs(c.position.x-px)<0.9 && Math.abs(c.position.z)<1.2 && Math.abs(c.position.y-(1.1+playerY))<1.2){c.position.z=999;coins++;score+=50;}
    });
    document.getElementById('speedFill').style.width=Math.round((speed/1.05)*100)+'%';
  }
  playerX+=(targetX-playerX)*0.18;
  player.position.x=playerX;
  player.position.y=playerY;
  if(playing && !jumping){
    let runCycle=Math.sin(clock*18)*0.7;
    legL.rotation.x=runCycle; legR.rotation.x=-runCycle;
    armL.rotation.x=-runCycle*0.8; armR.rotation.x=runCycle*0.8;
    player.position.y=playerY+Math.abs(Math.sin(clock*18))*0.08;
  } else if(jumping){
    legL.rotation.x=-0.6; legR.rotation.x=0.5; armL.rotation.x=-2.2; armR.rotation.x=-2.2;
  }
  player.scale.y=rolling?0.45:1;
  player.rotation.z=(playerX-targetX)*0.08;
  shadowBlob.position.x=playerX;
  shadowBlob.scale.setScalar(1 - playerY*0.25);
  camera.position.set(playerX*0.55, 4.6+playerY*0.5, 8.2);
  camera.lookAt(playerX*0.8,1.6,-12);
  document.getElementById('score').textContent=Math.floor(score)+' | 🪙 '+coins+' | '+Math.round(speed*100)+' km/h';
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
  </html>
